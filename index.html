<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2128 Bathroom Reno — Bathroom Plan</title>
<meta name="description" content="Updated scope and change list for the 2128 bathroom renovation. English / Español.">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --paper:#fbfaf7;
    --card:#ffffff;
    --ink:#17160f;
    --muted:#6d6860;
    --rule:#dcd7cc;
    --flag:#bd2f1b;
    --changeclr:#9a7000;
    --done:#2c6a3f;
    --chip:#efece4;
    --focus:#1b5fbf;
    --warnbg:#fff5e0;
    --warnrule:#e0b25e;
    --warnink:#7a5100;
    --hh:150px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#15140f;
      --card:#1d1c17;
      --ink:#f2efe6;
      --muted:#a29b8e;
      --rule:#3a382f;
      --flag:#ef6a52;
      --changeclr:#e0b23c;
      --done:#5aa872;
      --chip:#2b2921;
      --focus:#7fb0ff;
      --warnbg:#2b2416;
      --warnrule:#7a5f24;
      --warnink:#e5c98a;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.45;
    overflow-wrap:break-word;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}

  /* ---------- top bar ---------- */
  header{
    position:sticky;top:0;z-index:30;
    background:var(--paper);
    border-bottom:2px solid var(--ink);
    padding-top:env(safe-area-inset-top);
  }
  .bar{max-width:820px;margin:0 auto;padding:8px 16px 0}
  .titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px;overflow:hidden}
  /* reclaim screen height once the user starts scrolling */
  header.tight .titlerow{height:0;margin:0;opacity:0;pointer-events:none}
  header.tight .prog{display:none}
  h1{font-size:17px;margin:0;letter-spacing:-.01em;font-weight:800;line-height:1.2}
  h1 span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
  .lang{display:flex;border:2px solid var(--ink);border-radius:3px;overflow:hidden;flex:0 0 auto}
  .lang button{
    font:inherit;font-size:13px;font-weight:800;letter-spacing:.06em;
    background:transparent;color:var(--ink);border:0;padding:0 12px;cursor:pointer;min-height:38px;
  }
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  nav.tabs{display:flex;margin-top:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{
    font:inherit;font-size:14.5px;font-weight:700;white-space:nowrap;
    background:transparent;border:0;border-bottom:3px solid transparent;
    padding:9px 14px;margin:0;cursor:pointer;color:var(--muted);min-height:44px;flex:1 0 auto;
  }
  nav.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--flag)}

  /* jump chips */
  .jump{display:flex;gap:7px;padding:7px 0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
        border-top:1px solid var(--rule);scrollbar-width:none}
  .jump::-webkit-scrollbar{display:none}
  .jump a{
    flex:0 0 auto;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--ink);
    background:var(--chip);border:1px solid var(--rule);border-radius:99px;
    padding:7px 12px;white-space:nowrap;letter-spacing:.02em;
  }
  .jump a b{color:var(--muted);font-weight:700;margin-left:5px}

  /* progress strip */
  .prog{
    display:flex;align-items:center;gap:10px;
    font-size:12.5px;color:var(--muted);padding:0 0 8px;
  }
  .prog .track{flex:1;height:6px;background:var(--chip);border-radius:99px;overflow:hidden}
  .prog .fill{height:100%;width:0;background:var(--done);transition:width .2s}
  .prog #pcount{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);white-space:nowrap}
  .prog button{
    font:inherit;font-size:12px;font-weight:700;background:var(--chip);border:1px solid var(--rule);
    color:var(--muted);border-radius:99px;cursor:pointer;padding:6px 10px;white-space:nowrap;min-height:34px;
  }
  .prog button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- sketch photo ---------- */
  .shot{margin:16px 0 0;border:1px solid var(--rule);border-radius:4px;background:var(--card);overflow:hidden}
  .shot a{display:block;line-height:0;background:var(--chip)}
  .shot img{width:100%;height:auto;display:block}
  .shot .cap{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12.5px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--rule);line-height:1.4;
  }
  .shot .cap b{color:var(--ink);font-weight:700}
  .shot .cap .tap{flex:0 0 auto;font-weight:800;color:var(--focus);text-decoration:none}
  .missing{
    display:none;padding:20px 14px;font-size:14px;line-height:1.5;color:var(--warnink);
    background:var(--warnbg);border-bottom:1px solid var(--warnrule);
  }
  .missing code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;
    background:var(--chip);color:var(--ink);padding:1px 5px;border-radius:3px}
  .shot.noimg #shotlink,.shot.noimg .tap{display:none}
  .shot.noimg .missing{display:block}

  /* ---------- per-area photos ---------- */
  .ashots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:4px 0 16px}
  .areashot{
    position:relative;min-height:120px;margin:0;overflow:hidden;
    border:1px solid var(--rule);border-radius:4px;background:var(--card);
  }
  /* labelled placeholder fills the slot until the photo loads */
  .ashot-ph{
    position:absolute;inset:0;z-index:0;
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;text-align:center;
    padding:16px;font-size:13px;color:var(--muted);line-height:1.5;
    background:repeating-linear-gradient(-45deg,var(--chip) 0 10px,transparent 10px 20px);
  }
  .ashot-ph code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.94em;
    background:var(--card);color:var(--ink);padding:2px 6px;border-radius:3px;border:1px solid var(--rule)}
  .areashot .ashot-link{display:block;line-height:0;position:relative;z-index:1}
  .areashot img{width:100%;height:auto;display:block}
  .areashot.ok .ashot-ph{display:none}          /* photo loaded — drop placeholder */
  .areashot.noimg .ashot-link{display:none}      /* load failed — no broken icon */

  /* per-area plain-language summary */
  .adesc{
    margin:2px 0 14px;padding:11px 13px;font-size:14.5px;line-height:1.5;color:var(--ink);
    background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--muted);border-radius:4px;
  }
  .adesc.a-shower{border-left-color:#167a91}
  .adesc.a-vanity{border-left-color:#8a3f9e}
  .adesc.a-toilet{border-left-color:#3f7d36}
  .adesc.a-all{border-left-color:#566172}

  /* ---------- open questions ---------- */
  .open{
    margin:16px 0 0;border:2px solid var(--flag);border-radius:4px;background:var(--card);
    padding:13px 14px 4px;
  }
  .open h3{
    margin:0 0 9px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    font-weight:800;color:var(--flag);
  }
  .open ul{margin:0;padding:0 0 0 20px}
  .open li{margin:0 0 10px;font-size:15px;line-height:1.45}

  .lede{font-size:14.5px;color:var(--muted);margin:16px 0 0;line-height:1.5}

  /* ---------- sections ---------- */
  section{margin:26px 0 0;scroll-margin-top:calc(var(--hh) + 8px)}
  details{border-top:2px solid var(--ink)}
  summary{
    display:flex;align-items:center;gap:9px;justify-content:space-between;
    list-style:none;cursor:pointer;padding:11px 2px;
    font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;
    position:sticky;top:var(--hh);background:var(--paper);z-index:10;
  }
  summary::-webkit-details-marker{display:none}
  summary .meta{
    display:flex;align-items:center;gap:9px;flex:0 0 auto;
    font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:700;
    font-variant-numeric:tabular-nums;text-transform:none;
  }
  summary .caret{transition:transform .15s;display:inline-block;font-size:11px}
  details[open] summary .caret{transform:rotate(90deg)}
  summary .meta.alldone{color:var(--done)}

  ul.items{list-style:none;margin:0;padding:0 0 6px}
  ul.items li{border-top:1px solid var(--rule)}
  ul.items li:first-child{border-top:0}
  label.item{display:flex;gap:13px;align-items:flex-start;padding:13px 2px;cursor:pointer}
  label.item input{
    appearance:none;-webkit-appearance:none;
    flex:0 0 auto;width:27px;height:27px;margin:0;
    border:2px solid var(--ink);border-radius:4px;background:transparent;cursor:pointer;
    position:relative;top:1px;
  }
  label.item input:checked{background:var(--done);border-color:var(--done)}
  label.item input:checked::after{
    content:"";position:absolute;left:8px;top:3px;width:6px;height:13px;
    border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg);
  }
  label.item input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .txt{flex:1;min-width:0}
  label.item input:checked ~ .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
  .txt b{font-weight:700}
  .who,.flag{
    display:inline-block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    font-weight:800;padding:3px 7px;border-radius:3px;margin-right:7px;vertical-align:1.5px;
  }
  .who{color:var(--muted);background:var(--chip)}
  /* outlined, not solid — colour is the only thing separating cancel/change at a glance */
  .flag{background:transparent;border:2px solid;padding:1px 6px}
  .flag-cancel{color:var(--flag);border-color:var(--flag)}
  .flag-change{color:var(--changeclr);border-color:var(--changeclr)}
  /* colour-coded badges: trades (shown in By Area) + areas (shown in By Trade) */
  .who-framing{background:#a85820;color:#fff}
  .who-plumbing{background:#1f6fb2;color:#fff}
  .who-electrical{background:#9c6b00;color:#fff}
  .who-tile{background:#1f7d70;color:#fff}
  .who-general{background:#6a5a97;color:#fff}
  .who-shower{background:#167a91;color:#fff}
  .who-vanity{background:#8a3f9e;color:#fff}
  .who-toilet{background:#3f7d36;color:#fff}
  .who-all{background:#566172;color:#fff}
  .dim{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.9em;font-weight:700;
    background:var(--chip);padding:1px 5px;border-radius:3px;white-space:nowrap;
  }
  body.hidedone label.item input:checked{opacity:.5}
  body.hidedone ul.items li.isdone{display:none}
  .empty{padding:16px 2px;font-size:14px;color:var(--muted);font-style:italic}

  /* ---------- notes ---------- */
  ol.notes{margin:0;padding:6px 0 10px 22px}
  ol.notes li{margin:0 0 13px;padding-left:4px}
  ol.notes li::marker{font-weight:800;color:var(--muted)}

  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--muted);line-height:1.5}
  footer .btn{
    display:inline-block;margin-top:12px;font:inherit;font-size:13px;font-weight:700;
    background:var(--chip);border:1px solid var(--rule);color:var(--ink);
    border-radius:4px;padding:10px 14px;cursor:pointer;min-height:42px;
  }

  @media print{
    header,.jump,.prog,.noprint,footer .btn{display:none!important}
    body{font-size:10.5pt;background:#fff;color:#000}
    .wrap{max-width:none;padding:0}
    details{display:block!important}
    details > summary{position:static}
    section{page-break-inside:avoid}
    label.item input{display:none}
    .txt{text-decoration:none!important;color:#000!important}
    .shot{border:1px solid #999}
    .areashot:not(.ok){display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="titlerow">
      <h1 id="ttl">2128 Bathroom Reno<span id="sub">Bathroom Plan</span></h1>
      <div class="lang" role="group" aria-label="Language / Idioma">
        <button id="l-en" aria-pressed="true">EN</button>
        <button id="l-es" aria-pressed="false">ES</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="jump" id="jump"></div>
    <div class="prog">
      <span id="pcount">0 / 0</span>
      <span class="track"><span class="fill" id="pfill"></span></span>
      <button id="hidedone" aria-pressed="false"></button>
      <button id="reset"></button>
    </div>
  </div>
</header>

<div class="wrap">

  <figure class="shot" id="shot" style="margin-block:16px 0">
    <div class="missing" id="shotmissing"></div>
    <a href="sketch.jpeg" target="_blank" rel="noopener" id="shotlink">
      <img src="sketch.jpeg" alt="Reference sketch: final decisions, tile layout, shower niche, arch, and lighting" id="shotimg">
    </a>
    <figcaption class="cap">
      <span id="shotcap"></span>
      <a class="tap" href="sketch.jpeg" target="_blank" rel="noopener" id="shottap"></a>
    </figcaption>
  </figure>

  <div class="open" id="open"></div>

  <p class="lede" id="lede"></p>

  <div id="panel"></div>

  <footer>
    <span id="foot"></span><br>
    <button class="btn noprint" id="printbtn" onclick="window.print()"></button>
  </footer>
</div>

<script>
/* ============ CONTENT ============ */
var AREAS = [
  {id:"shower", en:"Shower",         es:"Regadera",           short_en:"Shower", short_es:"Regadera"},
  {id:"vanity", en:"Vanity Wall",    es:"Pared del Lavabo",   short_en:"Vanity", short_es:"Lavabo"},
  {id:"toilet", en:"Toilet Area",    es:"Área del Inodoro",   short_en:"Toilet", short_es:"Inodoro"},
  {id:"all",    en:"Whole Bathroom", es:"Todo el Baño",       short_en:"All",    short_es:"Todo"}
];
var TRADES = [
  {id:"framing",    en:"Framing / Drywall", es:"Estructura / Drywall", short_en:"Framing", short_es:"Estructura"},
  {id:"plumbing",   en:"Plumbing",          es:"Plomería",             short_en:"Plumbing",short_es:"Plomería"},
  {id:"electrical", en:"Electrical",        es:"Electricidad",         short_en:"Elec.",   short_es:"Elec."},
  {id:"tile",       en:"Tile",              es:"Azulejo",              short_en:"Tile",    short_es:"Azulejo"},
  {id:"general",    en:"General / Layout",  es:"General / Trazo",      short_en:"General", short_es:"General"}
];

function d(s){return '<span class="dim">'+s+'</span>';}

/* Reference photos per area. Drop these files in the repo root and they show up
   automatically; until then each slot shows a labelled placeholder. */
var AREA_IMAGES = {
  shower: ["shower1.jpeg"],
  vanity: ["vanity1.jpeg","vanity2.jpeg"],
  toilet: ["toilet1.jpeg","toilet2.jpeg"]
};

/* Plain-language "what this area should end up as" — the goal, so a worker can
   picture the result without reading every bullet. */
var AREA_DESC = {
  shower:{
    en:'A full walk-in glass shower — no half wall. Controls on the right wall, a ceiling rain head with body sprays opposite on the left. White subway walls in a clean vertical stack, a fluted floor pitched to the drain, and one wide lit niche on the right.',
    es:'Una ducha de vidrio completa, sin medio muro. Llaves en la pared derecha, regadera de lluvia en el techo y rociadores enfrente a la izquierda. Paredes de subway blanco en cuadrícula vertical, piso acanalado con caída a la coladera, y un nicho amplio con luz a la derecha.'},
  vanity:{
    en:'A 48" floating vanity pushed hard left, counter at 36", mirror centered on the cabinet, and a hidden LED glow along the top of the wall — no sconces. Marble-look tile with the full tile at top right so every cut hides in the corner and along the floor. The ~18" on the right stays open.',
    es:'Un mueble flotante de 48" pegado a la izquierda, cubierta a 36", espejo centrado con el mueble y una luz LED oculta en el borde superior de la pared — sin sconces. Azulejo tipo mármol con la loseta completa arriba a la derecha para esconder los cortes en la esquina y el piso. Los ~18" de la derecha quedan libres.'},
  toilet:{
    en:'The toilet sits inside a tall drywall arch. The opening is 32" wide — a 3.5" arch leg and a 4" gap on each side of the 17" toilet — and the arch wall projects 7.5" off the back to cover the tank, with the top of the arch stopping 7" below the ceiling. A hidden LED washes the whole back wall behind the arch. The bidet gets both water and power, and the lights are switched from the box by the door.',
    es:'El inodoro va dentro de un arco alto de drywall. La abertura es de 32" de ancho — 3.5" de arco y 4" de espacio a cada lado del inodoro de 17" — y la pared del arco sobresale 7.5" de atrás para cubrir el tanque, y la punta del arco termina 7" abajo del techo. Un LED oculto ilumina toda la pared de atrás detrás del arco. El bidé tiene agua y electricidad, y las luces se controlan desde la caja junto a la puerta.'},
  all:{
    en:'Details that tie the whole room together: every LED is 3000K on a dimmer, and no tile gets set until the grout colors are picked.',
    es:'Detalles que unifican todo el baño: cada LED es de 3000K con dimmer, y no se pega ningún azulejo hasta elegir el color de la lechada.'}
};

/* flag: "cancel" | "change" | null */
var ITEMS = [
/* ---- SHOWER ---- */
{id:"s1", a:"shower", t:"framing", flag:"change",
 en:'<b>Do NOT build the half wall.</b> Full glass enclosure instead.',
 es:'<b>NO construir el medio muro.</b> Todo será vidrio.'},
{id:"s2", a:"shower", t:"framing",
 en:'Frame the niche on the <b>right side</b> — '+d('48" × 17"')+' finished opening. Confirm with the tile setter before closing it up.',
 es:'Enmarcar el nicho del <b>lado derecho</b> — abertura terminada de '+d('48" × 17"')+'. Confirmar con el azulejero antes de cerrar.'},
{id:"s3", a:"shower", t:"framing",
 en:'Blocking for the glass panel.',
 es:'Refuerzo (blocking) para el panel de vidrio.'},
{id:"s13", a:"shower", t:"framing",
 en:'Leave the recess for the <b>plaster-in LED channel inside the niche</b>.',
 es:'Dejar el espacio para el <b>canal LED empotrado dentro del nicho</b>.'},
{id:"s4", a:"shower", t:"plumbing", flag:"change",
 en:'Shower <b>controls → RIGHT short wall</b>.',
 es:'<b>Llaves/controles → pared corta DERECHA</b>.'},
{id:"s5", a:"shower", t:"plumbing",
 en:'Showerheads + body sprays → <b>LEFT short wall</b> (opposite the controls).',
 es:'Regaderas y rociadores → <b>pared corta IZQUIERDA</b> (lado opuesto a las llaves).'},
{id:"s6", a:"shower", t:"plumbing",
 en:'Rainfall head mounted in the <b>CEILING</b>.',
 es:'Regadera tipo lluvia montada en el <b>TECHO</b>.'},
{id:"s7", a:"shower", t:"plumbing",
 en:'Slope the floor to the drain. Flutes run toward the drain.',
 es:'Dar caída al piso hacia la coladera. Las ranuras corren hacia el desagüe.'},
{id:"s8", a:"shower", t:"electrical",
 en:'Low-voltage <b>LED inside the niche</b>, trimless plaster-in channel.',
 es:'<b>LED de bajo voltaje dentro del nicho</b>, canal empotrado sin marco.'},
{id:"s9", a:"shower", t:"tile",
 en:'Walls: white subway '+d('8.5" × 2.5"')+' — <b>straight vertical stack, NO stagger</b>.',
 es:'Paredes: subway blanco '+d('8.5" × 2.5"')+' — <b>alineado vertical, SIN traslape</b>.'},
{id:"s10", a:"shower", t:"tile",
 en:'Floor: fluted tile, run <b>long-ways as seen from the entrance</b>, flutes pointing toward the drain.',
 es:'Piso: loseta acanalada, <b>a lo largo visto desde la entrada</b>, las ranuras apuntando a la coladera.'},
{id:"s11", a:"shower", t:"tile",
 en:'Niche: '+d('2×4')+' marble-look. Back face is <b>one full piece</b>; tile the return edges too.',
 es:'Nicho: mármol '+d('2×4')+'. El fondo es <b>una sola pieza</b>; azulejar también los cantos.'},
{id:"s12", a:"shower", t:"tile",
 en:'<b>DRY-LAY FIRST.</b> Niche top and bottom must land on the subway grout lines.',
 es:'<b>PRUEBA EN SECO PRIMERO.</b> Arriba y abajo del nicho deben caer en las juntas del subway.'},

/* ---- VANITY ---- */
{id:"v1", a:"vanity", t:"general",
 en:'Vanity is '+d('48"L × 18"D × 20"H')+' — <b>FLOATING (wall-hung)</b>, countertop at '+d('36"')+' off the floor, pushed <b>ALL THE WAY LEFT</b>.',
 es:'Mueble '+d('48" × 18" × 20"')+' — <b>FLOTANTE (colgado)</b>, cubierta a '+d('36"')+' del piso, pegado <b>TODO A LA IZQUIERDA</b>.'},
{id:"v2", a:"vanity", t:"general",
 en:'The ~'+d('18"')+' on the right stays <b>empty</b> (towel hook / plant stool).',
 es:'Los ~'+d('18"')+' de la derecha se quedan <b>vacíos</b> (gancho de toalla / banco con planta).'},
{id:"v3", a:"vanity", t:"general",
 en:'Mirror <b>centered on the vanity</b>, not on the wall.',
 es:'Espejo <b>centrado con el mueble</b>, no con la pared.'},
{id:"v4", a:"vanity", t:"framing",
 en:'<b>Blocking for the floating vanity</b> — '+d('48"')+' wide, top at '+d('36"')+'.',
 es:'<b>Refuerzo para el mueble flotante</b> — '+d('48"')+' de ancho, cubierta a '+d('36"')+'.'},

};

/* ============ STATE ============ */
var lang = localStorage.getItem("reno-lang") || "en";
var view = localStorage.getItem("reno-view") || "area";
var hideDone = localStorage.getItem("reno-hide") === "1";
var done = {}, openSec = {};
try{ done = JSON.parse(localStorage.getItem("reno-done") || "{}"); }catch(e){ done = {}; }
try{ openSec = JSON.parse(localStorage.getItem("reno-open") || "{}"); }catch(e){ openSec = {}; }

function save(){ localStorage.setItem("reno-done", JSON.stringify(done)); }
function saveOpen(){ localStorage.setItem("reno-open", JSON.stringify(openSec)); }
function byId(list,id){ for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; } return null; }
function shortOf(o){ return o[lang==="en"?"short_en":"short_es"]; }

/* ============ RENDER ============ */
function itemHTML(it, badgeGroup){
  var badge = it.flag ? '<span class="flag flag-'+it.flag+'">'+UI[lang][it.flag]+'</span>' : "";
  var who = "";
  if(badgeGroup==="trade"){ who = '<span class="who who-'+it.t+'">'+shortOf(byId(TRADES,it.t))+'</span>'; }
  else if(badgeGroup==="area"){ who = '<span class="who who-'+it.a+'">'+shortOf(byId(AREAS,it.a))+'</span>'; }
  var isDone = done[it.id] ? 1 : 0;
  return '<li'+(isDone?' class="isdone"':'')+'><label class="item">'+
         '<input type="checkbox" data-id="'+it.id+'"'+(isDone?" checked":"")+'>'+
         '<span class="txt">'+badge+who+it[lang]+'</span></label></li>';
}

function areaDescHTML(areaId){
  var desc = AREA_DESC[areaId];
  if(!desc) return "";
  return '<p class="adesc a-'+areaId+'">'+desc[lang]+'</p>';
}

function areaShotsHTML(areaId){
  var imgs = AREA_IMAGES[areaId];
  if(!imgs || !imgs.length) return "";
  var h = '<div class="ashots">';
  for(var i=0;i<imgs.length;i++){
    var f = imgs[i];
    h += '<figure class="areashot">'+
           '<a class="ashot-link" href="'+f+'" target="_blank" rel="noopener">'+
             '<img src="'+f+'" alt="Reference photo '+f+'" loading="lazy">'+
           '</a>'+
           '<span class="ashot-ph"><b>'+UI[lang].photoAdd+'</b> <code>'+f+'</code></span>'+
         '</figure>';
  }
  return h + '</div>';
}

function sectionHTML(secId, title, items, badgeGroup, topHTML){
  var n = 0;
  for(var i=0;i<items.length;i++) if(done[items[i].id]) n++;
  var all = (n === items.length && items.length > 0);
  var isOpen = openSec[secId] !== 0;
  var h = '<section id="sec-'+secId+'"><details'+(isOpen?" open":"")+' data-sec="'+secId+'">'+
          '<summary><span><span class="caret">▶</span> '+title+'</span>'+
          '<span class="meta'+(all?" alldone":"")+'">'+(all ? UI[lang].allDone : n+" / "+items.length)+'</span>'+
          '</summary>'+(topHTML||"")+'<ul class="items">';
  for(var j=0;j<items.length;j++) h += itemHTML(items[j], badgeGroup);
  return h + '</ul></details></section>';
}

function notesSectionHTML(secId, title, list){
  var isOpen = openSec[secId] !== 0;
  var h = '<section id="sec-'+secId+'"><details'+(isOpen?" open":"")+' data-sec="'+secId+'">'+
          '<summary><span><span class="caret">▶</span> '+title+'</span>'+
          '<span class="meta">'+list.length+'</span></summary><ol class="notes">';
  for(var i=0;i<list.length;i++) h += '<li>'+list[i][lang]+'</li>';
  return h + '</ol></details></section>';
}

function render(){
  document.documentElement.lang = lang;
  document.getElementById("sub").textContent = UI[lang].sub;
  document.getElementById("lede").textContent = UI[lang].lede;
  document.getElementById("reset").textContent = UI[lang].reset;
  document.getElementById("hidedone").textContent = UI[lang].hide;
  document.getElementById("hidedone").setAttribute("aria-pressed", hideDone);
  document.getElementById("foot").textContent = UI[lang].foot;
  document.getElementById("printbtn").textContent = UI[lang].print;
  document.getElementById("shotcap").innerHTML = UI[lang].cap;
  document.getElementById("shottap").textContent = UI[lang].tap;
  document.getElementById("shotmissing").innerHTML = UI[lang].missing;
  document.getElementById("l-en").setAttribute("aria-pressed", lang==="en");
  document.getElementById("l-es").setAttribute("aria-pressed", lang==="es");
  document.body.classList.toggle("hidedone", hideDone);

  /* open questions box */
  var oq = '<h3>' + UI[lang].openq + '</h3><ul>';
  for(var q=0;q<CONSIDER.length;q++) if(CONSIDER[q].open) oq += '<li>'+CONSIDER[q][lang]+'</li>';
  document.getElementById("open").innerHTML = oq + '</ul>';

  /* tabs */
  var tabs = [["area",UI[lang].byArea],["trade",UI[lang].byTrade],["notes",UI[lang].notes]];
  var th = "";
  for(var i=0;i<tabs.length;i++)
    th += '<button data-view="'+tabs[i][0]+'" aria-pressed="'+(view===tabs[i][0])+'">'+tabs[i][1]+'</button>';
  document.getElementById("tabs").innerHTML = th;

  /* panel + jump chips */
  var h = "", chips = "";
  if(view==="area"){
    for(var a=0;a<AREAS.length;a++){
      var grp = ITEMS.filter(function(x){return x.a===AREAS[a].id;});
      if(!grp.length) continue;
      h += sectionHTML(AREAS[a].id, AREAS[a][lang], grp, "trade", areaDescHTML(AREAS[a].id)+areaShotsHTML(AREAS[a].id));
      chips += chipHTML(AREAS[a].id, shortOf(AREAS[a]), grp);
    }
  } else if(view==="trade"){
    for(var t=0;t<TRADES.length;t++){
      var g2 = ITEMS.filter(function(x){return x.t===TRADES[t].id;});
      if(!g2.length) continue;
      h += sectionHTML(TRADES[t].id, TRADES[t][lang], g2, "area");
      chips += chipHTML(TRADES[t].id, shortOf(TRADES[t]), g2);
    }
  } else {
    h += notesSectionHTML("consider", UI[lang].consider, CONSIDER);
    h += notesSectionHTML("benefits", UI[lang].benefits, BENEFITS);
    chips  = '<a href="#sec-consider">'+UI[lang].consider+'</a>';
    chips += '<a href="#sec-benefits">'+UI[lang].benefits+'</a>';
  }
  document.getElementById("panel").innerHTML = h;
  document.getElementById("jump").innerHTML = chips;
  progress();
  measure();
}

function chipHTML(secId, label, grp){
  var n = 0;
  for(var i=0;i<grp.length;i++) if(done[grp[i].id]) n++;
  return '<a href="#sec-'+secId+'">'+label+'<b>'+n+'/'+grp.length+'</b></a>';
}

function progress(){
  var n = 0;
  for(var i=0;i<ITEMS.length;i++) if(done[ITEMS[i].id]) n++;
  document.getElementById("pcount").textContent = n+" / "+ITEMS.length+" "+UI[lang].of;
  document.getElementById("pfill").style.width = (n/ITEMS.length*100)+"%";
}

/* keep sticky offsets correct as the header changes height */
function measure(){
  var hh = document.querySelector("header").getBoundingClientRect().height;
  document.documentElement.style.setProperty("--hh", Math.round(hh)+"px");
}

/* ============ EVENTS ============ */
document.getElementById("l-en").onclick = function(){ lang="en"; localStorage.setItem("reno-lang","en"); render(); };
document.getElementById("l-es").onclick = function(){ lang="es"; localStorage.setItem("reno-lang","es"); render(); };

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-view]");
  if(!b) return;
  view = b.getAttribute("data-view");
  localStorage.setItem("reno-view", view);
  render();
  window.scrollTo({top:0});
});

document.getElementById("panel").addEventListener("change", function(e){
  var cb = e.target;
  if(cb.type!=="checkbox") return;
  var id = cb.getAttribute("data-id");
  if(cb.checked) done[id]=1; else delete done[id];
  cb.closest("li").classList.toggle("isdone", !!cb.checked);
  save();
  progress();
  refreshCounts();
});

document.getElementById("panel").addEventListener("toggle", function(e){
  var det = e.target;
  if(det.tagName!=="DETAILS") return;
  openSec[det.getAttribute("data-sec")] = det.open ? 1 : 0;
  saveOpen();
}, true);

/* Reveal an area photo once it actually loads; on failure keep the labelled
   placeholder and hide the broken image. Capture phase because load/error do
   not bubble, and the panel is re-rendered on every language / tab change. */
document.getElementById("panel").addEventListener("load", function(e){
  var fig = e.target.closest && e.target.closest(".areashot");
  if(fig){ fig.classList.add("ok"); fig.classList.remove("noimg"); }
}, true);
document.getElementById("panel").addEventListener("error", function(e){
  var fig = e.target.closest && e.target.closest(".areashot");
  if(fig){ fig.classList.add("noimg"); }
}, true);

/* update per-section + chip counts without re-rendering (keeps scroll position) */
function refreshCounts(){
  var groups = (view==="area") ? AREAS : (view==="trade" ? TRADES : []);
  for(var i=0;i<groups.length;i++){
    var g = groups[i];
    var grp = ITEMS.filter(function(x){ return view==="area" ? x.a===g.id : x.t===g.id; });
    if(!grp.length) continue;
    var n = 0;
    for(var j=0;j<grp.length;j++) if(done[grp[j].id]) n++;
    var all = n===grp.length;
    var sec = document.getElementById("sec-"+g.id);
    if(sec){
      var meta = sec.querySelector(".meta");
      meta.textContent = all ? UI[lang].allDone : n+" / "+grp.length;
      meta.classList.toggle("alldone", all);
    }
    var chip = document.querySelector('#jump a[href="#sec-'+g.id+'"] b');
    if(chip) chip.textContent = n+"/"+grp.length;
  }
}

document.getElementById("reset").onclick = function(){
  done = {}; save(); render();
};

document.getElementById("hidedone").onclick = function(){
  hideDone = !hideDone;
  localStorage.setItem("reno-hide", hideDone ? "1" : "0");
  document.body.classList.toggle("hidedone", hideDone);
  this.setAttribute("aria-pressed", hideDone);
};

/* The photo can be named any of these — first one that loads wins, so it does
   not matter whether the phone exported .jpg, .jpeg or .png. */
var SHOT_NAMES = ["sketch.jpeg","sketch.jpg","sketch.png","sketch.webp","sketch.JPG","sketch.JPEG","sketch.PNG"];
var shotN = 0;
var shotImg = document.getElementById("shotimg");
var shotLink = document.getElementById("shotlink");
var shotTap = document.getElementById("shottap");

shotImg.addEventListener("error", function(){
  shotN++;
  if(shotN < SHOT_NAMES.length){
    shotImg.src = SHOT_NAMES[shotN];
  } else {
    document.getElementById("shot").classList.add("noimg");
    measure();
  }
});
shotImg.addEventListener("load", function(){
  document.getElementById("shot").classList.remove("noimg");
  shotLink.href = shotImg.getAttribute("src");
  shotTap.href = shotImg.getAttribute("src");
  measure();
});

window.addEventListener("resize", measure);
window.addEventListener("orientationchange", measure);

/* collapse the title row + progress strip while scrolling, so the sticky
   header stays small on a phone. Hysteresis keeps it from flapping. */
var hdr = document.querySelector("header"), tight = false;
window.addEventListener("scroll", function(){
  var y = window.scrollY;
  if(!tight && y > 130){ tight = true; hdr.classList.add("tight"); measure(); }
  else if(tight && y < 70){ tight = false; hdr.classList.remove("tight"); measure(); }
}, {passive:true});

render();
</script>
